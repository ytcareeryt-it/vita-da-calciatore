<style>

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

#stage{min-width:0;display:flex;flex-direction:column;gap:14px}
.yr{display:flex;align-items:baseline;gap:12px;margin-top:10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}

.yr span{color:var(--muted);font-size:.85rem}
.yr .ph{margin-left:auto;font-size:.72rem;letter-spacing:.1em;background:var(--azzurri-soft);color:var(--azzurri);padding:2px 8px;border-radius:4px;font-weight:700}
.spd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.spd button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 6px;text-align:center;line-height:1.35;min-height:44px}
.spd button[aria-pressed=true]{border-color:var(--azzurri);box-shadow:inset 0 0 0 1px var(--azzurri)}
.spd b{display:block;font-size:.95rem}.spd span{display:block;font-size:.68rem;color:var(--muted)}.spd em{display:block;font-style:normal;font-weight:700;color:var(--azzurri);font-size:1.05rem}
.venue{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:2px 0 6px;font-size:.78rem;color:var(--muted)}
.venue b{font:600 .72rem/1 var(--f-body);padding:3px 7px;border-radius:999px;background:var(--azzurri);color:#fff}
.venue b.sA{background:#6b3fa0}.venue b.sN{background:#2e7d32}
.venue .vs{font-weight:600;color:var(--ink)}
ul.mt{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.88rem}
ul.mt li{padding:5px 8px;border-radius:6px;background:rgba(127,127,127,.09)}
ul.mt small{display:block;color:var(--muted);font-size:.74rem}
.phead{display:flex;gap:10px;align-items:center}
.kvbig{grid-column:1/-1}.kvbig b{font-size:1.6rem;color:var(--azzurri)}
.mvn{font-size:.8rem;margin:-4px 0 0;padding:4px 10px;border-radius:6px;background:rgba(127,127,127,.09);max-width:68ch}.mvn.up b{color:var(--verde)}.mvn.dn b{color:var(--rosso)}
.entry.mv{background:none;border:none;padding:0}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;max-width:68ch;overflow-wrap:anywhere}
.entry h3{font-family:var(--f-display);font-size:1.02rem;margin:0 0 4px}
.entry p{margin:0}
.entry.res{background:var(--azzurri-soft);border-color:transparent}
.entry.big{background:var(--gold-soft);border-color:var(--gold)}
.entry.bad{border-left:4px solid var(--rosso)}
.entry.good{border-left:4px solid var(--verde)}
.delta{display:inline-block;font-family:var(--f-num);font-size:.78rem;padding:0 6px;margin:0 3px 0 0;border-radius:3px;background:var(--chip)}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}
.season{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:8px}
.season div{background:var(--chip);border-radius:6px;padding:6px 8px;text-align:center}
.season b{display:block;font-family:var(--f-num);font-size:1.3rem;font-weight:500;line-height:1.2}
.season span{font-size:.68rem;color:var(--muted)}
#actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 78%,transparent);padding:14px 0 max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:68ch}
.ask{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--azzurri);border-radius:6px;padding:10px 14px}
.choice:hover{border-color:var(--azzurri);background:var(--azzurri-soft)}
.choice small{display:block;color:var(--muted);font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.title-screen{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px;max-width:68ch}
.title-screen h2{font-family:var(--f-display);font-size:1.9rem;margin:0 0 8px;text-wrap:balance;line-height:1.35}
.title-screen label{display:block;font-size:.82rem;color:var(--muted);margin-top:14px}
.title-screen input{width:100%;max-width:340px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.end{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:22px;max-width:68ch}
.end h2{font-family:var(--f-display);font-size:1.7rem;margin:0 0 6px}
.score{font-family:var(--f-num);font-size:3rem;color:var(--gold);line-height:1}
@media (prefers-reduced-motion:reduce){.bar i u{transition:none}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.auto{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 0;letter-spacing:.05em}

@media(max-width:1000px),(orientation:portrait){
 body{font-size:15px}
 header.top{padding:10px 0 8px;gap:8px}
 header.top h1{font-size:1.1rem}
 header.top h1 small{font-size:.68rem}
 .ctl{width:100%}.ctl .btn{flex:1;min-height:40px;padding:6px 8px;font-size:.8rem}
 #mini{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
 #mini button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-height:64px}
 .m-ovr{font-family:var(--f-num);font-size:1.9rem;line-height:1;color:var(--azzurri);min-width:1.6em;text-align:center}
 .m-main b{display:block;font-family:var(--f-display);font-size:1rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .m-main small,.m-r small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .m-r{text-align:right}.m-r b{font-family:var(--f-num);font-weight:600;font-size:1.5rem;line-height:1.1;display:block;color:var(--azzurri)}
 .m-sub{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);padding-top:3px;margin-top:-2px}.m-sub i{font-style:normal}
 main{gap:12px}
 #card{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
 #card.open{transform:none;visibility:visible;transition:transform .25s}
 .sheet-close{display:block;align-self:flex-end;min-height:40px}
 .tabbody{max-height:none}
 .tabs button{padding:8px 14px;font-size:.85rem}
 .entry{max-width:none;padding:12px 14px}
 .season{grid-template-columns:repeat(3,1fr)}
 #actions{max-width:none;max-height:58vh;overflow:auto;padding-top:10px}
 .choice{min-height:52px;padding:12px 14px;font-size:.98rem}
 .btn.primary{min-height:52px}
 .title-screen{padding:22px 16px}.title-screen h2{font-size:1.5rem}
 .end{padding:16px}
 .yr b{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){#card{transition:none}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{touch-action:manipulation}
.title-screen select{display:block;width:100%;max-width:340px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.tbscroll{overflow-x:auto;margin-bottom:12px}
.tbl{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th.l,.tbl td.l{text-align:left;white-space:normal;min-width:7em}
.tbl th{color:var(--muted);font-weight:500}

<div class="tri"></div>
<header class="top">
  <h1>Vita da Calciatore<small>イタリアに生まれ、ボールとともに生きて、死ぬ。</small></h1>
  <div class="ctl"><button class="btn small" id="btn-pause" type="button" aria-pressed="false">一時停止</button><button class="btn small" id="btn-speed" type="button">速度：ふつう</button><button class="btn small" id="btn-restart" type="button">最初から</button></div>
</header>

  <aside id="card" aria-label="選手カード"></aside>

    <div id="feed" aria-live="polite"></div>
    <div id="actions"></div>
  </section>
</main>
<script>
'use strict';
/* ===== utils ===== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const chance=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=Math.random();return (u-3)/Math.sqrt(0.5)};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';return a>=1e8?s+'€'+(a/1e6).toFixed(0)+'M':a>=1e6?s+'€'+(a/1e6).toFixed(1)+'M':a>=1e3?s+'€'+Math.round(a/1e3)+'K':s+'€'+a};
const FIRST=['Luca','Marco','Matteo','Lorenzo','Alessandro','Andrea','Davide','Federico','Riccardo','Giovanni','Simone','Tommaso','Gabriele','Edoardo','Nicolò','Pietro','Emanuele','Filippo'];
const LAST=['Ferrari','Esposito','Bianchi','Romano','Colombo','Ricci','Marino','Greco','Bruno','Gallo','Conti','De Luca','Costa','Giordano','Rizzo','Lombardi','Moretti','Barbieri','Fontana','Santoro','Mariani','Rinaldi','Caruso','Galli','Martini','Leone','Longo','Gentile','Vitale','Serra','Coppola','De Santis','Marchetti','Parisi','Villa','Sanna','Fabbri','Benedetti','Orlando'];
const GIRLS=['Giulia','Sofia','Francesca','Chiara','Martina','Elena','Sara','Valentina','Alessia','Giorgia','Federica','Ilaria'];
const KID_M=['Leonardo','Francesco','Tommaso','Diego','Mattia','Santiago','Riccardo'];
const KID_F=['Aurora','Ginevra','Beatrice','Alice','Vittoria','Bianca','Emma'];
const MEN=['Paolo','Carlo','Giuseppe','Roberto','Enzo','Sergio','Franco','Gino','Beppe','Nando'];

/* ===== data ===== */
const REGIONS=[
 {n:'ロンバルディア',inc:5,city:['ミラノ郊外','ベルガモ','ブレシア','コモ'],clubs:['INT','MIL','ATA'],fl:'霧の朝と工場の煙突、日曜はサン・シーロの歓声。'},
 {n:'ピエモンテ',inc:4,city:['トリノ','アレッサンドリア','クーネオ'],clubs:['JUV','TOR'],fl:'アルプスの風と、白黒かグラナータかを決める日曜日。'},
 {n:'カンパニア',inc:1.5,city:['ナポリ','サレルノ','カゼルタ'],clubs:['NAP','SAL'],fl:'路地には洗濯物が揺れ、壁画の英雄が子どもたちを見下ろしている。'},
 {n:'ラツィオ',inc:4,city:['ローマ','ラティーナ','ティヴォリ'],clubs:['ROM','LAZ'],fl:'永遠の都。ローマ派かラツィオ派か、家庭の食卓でさえ陣営が分かれる。'},
 {n:'トスカーナ',inc:4,city:['フィレンツェ','リヴォルノ','エンポリ'],clubs:['FIO','EMP'],fl:'丘の上のオリーブ畑。紫のシャツを着た祖父がいる。'},
 {n:'エミリア＝ロマーニャ',inc:5,city:['ボローニャ','パルマ','モデナ'],clubs:['BOL','PAR','SAS'],fl:'パスタ工場とサーキットの町。食と車とボールの国。'},
 {n:'ヴェネト',inc:5,city:['ヴェローナ','ヴィチェンツァ','パドヴァ'],clubs:['VER','VEN'],fl:'運河と霧、そして小さな町のスタジアム。'},
 {n:'リグーリア',inc:4,city:['ジェノヴァ','ラ・スペツィア','サヴォーナ'],clubs:['GEN','SAM'],fl:'港町。イタリア最古のクラブがここにある。'},
 {n:'シチリア',inc:1.5,city:['パレルモ','カターニア','メッシーナ'],clubs:['PAL','CAT'],fl:'レモンの香る海辺の町。裸足でボールを蹴る子どもが絶えない。'},
 {n:'プーリア',inc:2,city:['バーリ','レッチェ','ターラント'],clubs:['BAR','LEC'],fl:'白い街と青い海。夏の夕方、広場はいつもサッカー場だ。'},
 {n:'サルデーニャ',inc:2,city:['カリャリ','サッサリ'],clubs:['CAG'],fl:'海に囲まれた島。島のチームは島の誇りだ。'},
 {n:'フリウリ',inc:4,city:['ウーディネ','トリエステ'],clubs:['UDI','TRI'],fl:'北東の国境の町。静かだが、粘り強い人々が住む。'},
 {n:'カラブリア',inc:1,city:['レッジョ・カラブリア','コゼンツァ','カタンツァーロ'],clubs:['CAT','NAP'],fl:'長靴のつま先。海と山に挟まれた町で、若者は島の外に夢を見る。'},

const AGENT_TX={

 mid:{fresh:['契約が満了を迎えた。いくつかのクラブから打診が届いているが、条件は一長一短だ。','契約満了。エージェントが慎重に、条件を探っている。'],mid:['夏の移籍市場。あなたに関心を示すクラブがある。','移籍市場。目立った動きはないが、いくつかのクラブが調査していると聞く。']},
 lo:{fresh:['契約が満了を迎えた。しかし、エージェントからの電話は、ほとんど鳴らなかった。','契約満了。待てど暮らせど、連絡は来ない。提示された条件は、現状維持とほとんど変わらなかった。'],mid:['夏の移籍市場。あなたの名前が挙がることは、ほとんどなかった。','移籍市場が閉まるまで、電話が鳴ることはなかった。']}
};
/* ===== key moments (with venue) ===== */
const SIDE={H:'ホーム',A:'アウェイ',N:'中立地'};
const venueOf=k=>VEN[k]||[(S&&S.city)||'地元','市営スタジアム'];
const vtag=m=>`<div class="venue"><b class="s${m.side}">${SIDE[m.side]}</b><span>${esc(m.city)}／${esc(m.stad)}</span>${m.opp?`<span class="vs">vs ${esc(m.opp)}</span>`:''}</div>`;
const rside=()=>chance(.5)?'H':'A';
const mvs=(side,k)=>{const v=venueOf(side==='H'?S.club:k);return {side,city:v[0],stad:v[1],opp:cname(k)}};
const mnu=(v,opp)=>({side:'N',city:v[0],stad:v[1],opp});
const ctryClubs=()=>{const ct=LG[C[S.club].lg].ct;return Object.values(C).filter(c=>c.k!=='KID'&&c.k!==S.club&&LG[c.lg].ct===ct&&VEN[c.k])};
const lgClubs=()=>Object.values(C).filter(c=>c.lg===C[S.club].lg&&c.k!==S.club&&VEN[c.k]);
const euOpp=()=>pick(EUOPP.filter(x=>x[0]!==cname(S.club)));
function lgMatch(side){const l=lgClubs();if(!l.length){const v=venueOf(S.club);return {side:'H',city:v[0],stad:v[1],opp:'ライバル'}}return mvs(side||rside(),pick(l).k)}
function euMatch(side){const o=euOpp(),h=venueOf(S.club);side=side||rside();return side==='H'?{side,city:h[0],stad:h[1],opp:o[0]}:{side,city:o[1],stad:o[2],opp:o[0]}}
function cupOpp(){const l=ctryClubs().sort((a,b)=>b.lv-a.lv);return l.length?pick(l.slice(0,Math.max(3,Math.ceil(l.length*.5)))):null}
const FWMF=()=>S.pos==='FW'||S.pos==='MF';
const mv=(c,o)=>{c.fame+=o.fame||0;c.joy+=o.joy||0;c.g+=o.g||0;c.as+=o.as||0};
const mom=(title,m,body,cls)=>say(`<h3>${title}</h3>${vtag(m)}<p>${body}</p>`,cls||'big');
const hasFans=()=>!(S.year===2020||S.year===2021);
const crowd=m=>!hasFans()?'無観客のスタジアムに、選手の声とボールの音だけが響いた。':m.side==='N'?pick(['青と相手の色が半分ずつ客席を埋め、スタジアムが震えた。','中立の地に、両国のサポーターの歌声が響き渡った。','国旗の波が客席を埋め尽くし、試合前から地鳴りのような熱気だった。']):m.side==='H'?pick(['スタジアムは超満員、地鳴りのような声援が降り注いだ。','ホームの観衆が一体となって、背中を押した。']):pick(['敵地の凄まじいブーイングが耳を塞いだ。','アウェイ席の遠征サポーターだけが、最後まで歌い続けていた。']);

async function deciderMoment(ctx,type){await deciderMoment0(ctx,type);mvNote()}
async function deciderMoment0(ctx,type){
 const {lgk,lg}=ctx,n=LGN[lgk];
 if(type==='title'){
  const lead=ctx.rank===1,m=lgMatch(),adv=m.side==='H';
  mom(lead?'首位を守り切れるか':'逆転優勝を懸けた最終盤',m,`${lg.n}、${pick(['最終節','ラスト2節','最終節（優勝決定の一戦）'])}。${lead?'わずか勝点1のリードで首位に立っている。':'首位との差は、あと1勝で並ぶところまで縮まった。'}${crowd(m)}`);
  const i=await ask('この大一番、あなたの役割は？',[{label:'エースとして決めにいく',sub:'PKも自分で蹴る'},{label:'チームの勝利を最優先、役割に徹する',sub:'守備もハードワーク'},{label:'負傷を隠して強行出場する',sub:'賭けに出る'}]);
  const hit=chance(clamp(.5+(ctx.o-ctx.L)*.012+[0,.04,.08][i]+(adv?.03:0),.3,.85));let t='';
  if(hit){ctx.rank=1;if(i===0){ctx.g+=S.pos==='FW'?2:1;t='値千金のゴール。';ctx.fame+=4}t+=lead?'守り切った。クラブは歓喜に包まれた。':'劇的な逆転で、ついに頂点に立った。';ctx.fame+=3;ctx.joy+=8}
  else{ctx.rank=lead?2:Math.max(2,ctx.rank);t=lead?'最後の最後で勝ち点を落とし、首位の座は他クラブの手に渡った。':'あと一歩届かなかった。シーズン最後の夜、ピッチに座り込んだまま、あなたは動けなかった。';ctx.joy-=6}
  if(i===2&&chance(.35)){ctx.ap=Math.max(0,ctx.ap-4);S.bonus.phy-=1;t+=' 無理がたたり、負傷が悪化した。'}
  say(`<p>${t}</p>`,hit?'good':'bad');
 }else if(type==='relegation'){
  const m=lgMatch();
  mom('残留を懸けた最終節',m,`降格圏との差はわずか。勝たなければ、クラブは来季、一つ下のリーグで戦うことになる。${hasFans()?'サポーターのバナーには「最後まで一緒に」と書かれていた。':'無観客の静寂が、プレッシャーをいっそう重くした。'}`);
  const i=await ask('あなたはどうする？',[{label:'責任を背負い、全力で戦う',sub:'前線から走り続ける'},{label:'監督に戦術変更を直訴する',sub:'守備固めか、一点勝負か'},{label:'チームメイトを鼓舞する',sub:'円陣の中心に立つ'}]);
  const hit=chance(clamp(.5+(ctx.o-ctx.L)*.012+[.03,.0,.05][i],.3,.85));
  if(hit){ctx.rank=Math.min(ctx.rank,n-4);ctx.fame+=4;ctx.joy+=8;say(`<p>劇的な勝利で残留を決めた。${hasFans()?'ピッチ全体にサポーターがなだれ込み、':''}街の夜は朝まで続いた。</p>`,'good')}
  else{ctx.rank=Math.max(ctx.rank,n-2);ctx.joy-=8;say(`<p>力及ばず、降格が決まった。ロッカールームに響いたのは、誰かのすすり泣きだけだった。</p>`,'bad')}
 }else if(type==='promo'){
  const m=lgMatch();
  mom('自動昇格を懸けた最終節',m,`昇格圏の2位以内で最終節を迎えた。引き分けでも届くが、ライバルが勝てば順位は入れ替わる。${crowd(m)}`);
  const i=await ask('この一戦、どう戦う？',[{label:'攻めの姿勢を貫く',sub:'先に点を奪う'},{label:'守備を固めて勝ち点1を確実に',sub:'リスクを避ける'}]);
  const hit=chance(clamp(.62+(ctx.o-ctx.L)*.01+(i===1?.04:0),.35,.88));
  if(hit){ctx.fame+=3;ctx.joy+=8;honor('昇格決定',1);say(`<p>終了の笛と同時に、昇格が決まった。クラブにとって何年ぶりかの上位リーグ。街中の車がクラクションを鳴らした。</p>`,'good')}
  else{ctx.rank=3;ctx.joy-=5;say(`<p>最終節の黒星で、2位の座から滑り落ちた。昇格はお預けとなった。</p>`,'bad')}
 }else{
  const m=lgMatch(),vs=m.opp;
  mom('昇格プレーオフ決勝',m,`自動昇格には届かなかったが、プレーオフ決勝で${esc(vs)}と一発勝負。勝てば、クラブは新たな舞台へ。${crowd(m)}`);
  const i=await ask('この勝負、どう挑む？',[{label:'攻撃の先頭に立つ',sub:'自分で決める'},{label:'堅実にチームを支える',sub:'ミスをしない'}]);
  const hit=chance(clamp(.42+(ctx.o-ctx.L)*.01+(i===0?.02:.04),.25,.8));
  if(hit){ctx.rank=2;ctx.fame+=4;ctx.joy+=8;honor('昇格プレーオフ勝利',2);say(`<p>歓喜の昇格。クラブの歴史に残る夜になった。</p>`,'good')}else{ctx.joy-=4;say(`<p>わずかに及ばず、昇格を逃した。来季への悔しさが、胸に残った。</p>`,'bad')}
 }
}

const EVENTS=[];

async function scene(title,body,q,opts,cls){
 say(`<h3>${title}</h3><p>${body}</p>`,cls||'');
 const i=await ask(q,opts.map(o=>({label:o.l,sub:o.s})));
 if(opts[i].r)S.risk=clamp(S.risk+opts[i].r,0,100);
 const r=await opts[i].f();
 if(r.c&&r.c.money)r.c={...r.c,money:Math.round(r.c.money*infl(S.year))};
 const h=r.c?chg(r.c):'';
 say(`<p>${r.t}</p>${h}`,r.k||'res');
 if(r._ban){S.flags.forceRetire='ban'}
 if(r._ret){S.flags.forceRetire='heart'}
 if(r._ab){S.flags.noItaly=1;forceAbroad()}
 if(r._div&&S.spouse){S.flags.divorced=1;S.spouse=null}
 return i;
}

 }else if(t==='coach'||t==='sd'){

 }else{

async function postStep(){
 const P=S.post;if(!P)return;
 if((P.t==='coach'||P.t==='sd')&&S.age>=68&&!P.done){P.done=1;P.title+='（勇退）';say(`<p>長い現場生活に区切りをつける時が来た。最後の日、${P.t==='coach'?'ベンチに別れを告げ、選手たちに胴上げされた。':'デスクを片づけ、同僚たちに花束を渡された。'}</p>`,'big')}
 if(P.t==='biz'&&S.age>=70&&!P.done){P.done=1;P.title+='（引退）'}
 if(P.t==='media'&&S.age>=72&&!P.done){P.done=1;P.title+='（勇退）'}
 if(S.age>=72||P.t==='quiet'||P.done)await elderStep();
 else if(P.t==='coach'||P.t==='sd')await managerStep();
 else if(P.t==='biz')await bizStep();
 else await mediaStep();
}

function bizOutcome(p,mode){
 const P=S.post,Sx=SECT[P.sect],V=Math.round(120000*Math.pow(2.6,P.size)*infl(S.year));
 if(chance(clamp(p,.15,.9))){P.size=Math.min(5,P.size+1);return{t:`事業は軌道に乗り、<b>${Sx.tiers[P.size-1]}</b>へと成長した。`,c:{money:Math.round(V*(mode==='grow'?.9:.45)),fame:2,joy:6},k:'good'}}
 if(mode==='grow'&&chance(.5))P.size=Math.max(1,P.size-1);
 return{t:'業績は伸びず、損失を出した。「ピッチのようにはいかない」と苦笑した。',c:{money:-Math.round(V*(mode==='grow'?.5:.15)),joy:-6},k:'bad'};
}

 const bg=`${esc(S.region.n)}州${esc(S.city)}（${HOODTX[S.hood]}）／${esc(S.fam.n)}`;
 const html=`<div class="end"><div class="psub">人生の評価</div><div class="score">${sc}</div><h2>${T[1]}</h2><p>${T[2]}</p>
 <div class="psub" style="margin:6px 0 12px">${S.by}年生まれ・享年${S.age}歳／${bg}</div>
 ${reviewHTML()}
 ${S.post&&S.post.title?`<h3 class="rv">引退後</h3><p>${esc(S.post.title)}</p>`:''}
 ${hs.length?`<h3 class="rv">主な栄誉</h3><div class="tabbody" style="max-height:none">${hs.map(h=>`<div class="trophy"><span>${esc(h.n)}</span><b>${h.a}歳</b></div>`).join('')}</div>`:''}</div>`;
 addEntry(html,'');
 const i=await ask(null,[{label:'もう一度、別の人生を生きる'},{label:'この人生の記録をコピーする'}]);
 if(i===1){const t=summaryText();try{await navigator.clipboard.writeText(t);say('<p>記録をコピーしました。</p>','res')}catch(err){say(`<p>コピーできませんでした。以下を選択して使ってください。</p><p style="white-space:pre-wrap;user-select:all">${esc(t)}</p>`,'res')}
  await ask(null,[{label:'もう一度、別の人生を生きる'}]);}
 title();
}
async function title(){
 RUN++;AUTO=false;setSheet(false);S=null;feed.innerHTML='';act.innerHTML='';renderCard();
 const sv=loadSave();
 const wrap=document.createElement('div');wrap.className='title-screen';
 wrap.innerHTML=`<div class="psub" style="letter-spacing:.14em">ITALIA ・ CALCIO ・ VITA</div><h2>イタリアに生まれ、<br>ボールとともに生きて、死ぬ。</h2><p>0歳から最期の日まで。名前も、生まれた町も、才能も、選べるのはほんの一部だけ。<br>ポジション、移籍、恋、スキャンダル、そして引退後の人生まで。サッカー選手の一生を、追体験しよう。</p><label for="nm">あなたの名前（空欄ならイタリア風の名前がランダムで付きます）</label><input id="nm" maxlength="24" autocomplete="off" placeholder="例：Luca Ferrari"><label for="rg">生まれる場所</label><select id="rg"><option value="-1">おまかせ（ランダム）</option>${REGIONS.map((r,i)=>`<option value="${i}">${r.n}州</option>`).join('')}</select><label for="era">生まれる年（1970年から1年刻み。選んだ年から人生が始まります）</label><select id="era"><option value="-1">おまかせ（ランダム）</option>${BYEARS.map(y=>`<option value="${y}">${y}年${y===2026?'（現在）':''}</option>`).join('')}</select><label>進行スピード（全人生を通しでプレイした場合の目安時間）</label><div class="spd" role="group" aria-label="進行スピード">${['ゆっくり','ふつう','はやい'].map((n,i)=>`<button type="button" data-sp="${i}" aria-pressed="${i===SPEED}"><b>${n}</b><span>100字を${T100[i]}秒で読む想定</span><em>約${estMin(i)}</em></button>`).join('')}</div><p class="psub" style="margin:6px 0 0">所要時間 ＝ 選択（判断）1回につき${DECIDE_SEC}秒 ＋ 本文の文字数÷100×読む秒数。平均で判断およそ${EST.dec}回、本文およそ${Math.round(EST.chars/1000)*1000}字（ランダム人生の実測平均）。</p>`;
 feed.appendChild(wrap);
 wrap.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{SPEED=+b.dataset.sp;wrap.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#btn-speed').textContent='速度：'+['ゆっくり','ふつう','はやい'][SPEED]});
 const opts=[{label:'新しい人生を始める',sub:'出身と年代は上で選べます。家庭と才能はランダム'}];
 if(sv&&!sv.dead&&sv.age>=3)opts.push({label:`続きから（${sv.name}・${sv.age}歳）`,sub:'前回の自動保存から再開'});
 const i=await ask(null,opts);
 const nm=($('#nm')?$('#nm').value.trim():'').slice(0,24);
 const rgv=$('#rg')?$('#rg').value:'-1',erv=$('#era')?$('#era').value:'-1';
 feed.innerHTML='';
 if(i===1){S=sv;applyWorld(sv);if(!S.lgMap)S.lgMap={};if(!S.clubPrev)S.clubPrev={};ensureKid();renderLog();renderCard();lifeLoop()}
 else{S=newState(nm,+rgv,+erv);renderCard();lifeLoop()}
}
$('#btn-pause').onclick=()=>setPaused(!PAUSED);
$('#btn-speed').onclick=function(){SPEED=(SPEED+1)%3;this.textContent='速度：'+['ゆっくり','ふつう','はやい'][SPEED]};
let rsTimer=0;
$('#btn-restart').onclick=function(){
 if(!rsTimer){this.textContent='もう一度押すとリセット';rsTimer=setTimeout(()=>{rsTimer=0;this.textContent='最初からやり直す'},3000);return}
 clearTimeout(rsTimer);rsTimer=0;this.textContent='最初からやり直す';clearSave();title();
};
title();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
