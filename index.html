.yr span{color:var(--muted);font-size:.85rem}

.entry.bad{border-left:4px solid var(--rosso)}
.entry.good{border-left:4px solid var(--verde)}
.delta{display:inline-block;font-family:var(--f-num);font-size:.78rem;padding:0 6px;margin:0 3px 0 0;border-radius:3px;background:var(--chip)}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}
.season{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:8px}
.season div{background:var(--chip);border-radius:6px;padding:6px 8px;text-align:center}
.season b{display:block;font-family:var(--f-num);font-size:1.3rem;font-weight:500;line-height:1.2}
.season span{font-size:.68rem;color:var(--muted)}

.ask{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--azzurri);border-radius:6px;padding:10px 14px}

.choice small{display:block;color:var(--muted);font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.title-screen{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px;max-width:68ch}
.title-screen h2{font-family:var(--f-display);font-size:1.9rem;margin:0 0 8px;text-wrap:balance;line-height:1.35}
.title-screen label{display:block;font-size:.82rem;color:var(--muted);margin-top:14px}
.title-screen input{width:100%;max-width:340px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.end{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:22px;max-width:68ch}
.end h2{font-family:var(--f-display);font-size:1.7rem;margin:0 0 6px}
.score{font-family:var(--f-num);font-size:3rem;color:var(--gold);line-height:1}

 const lg=C[key].lg,n=LGN[lg];
 const known=Object.values(C).filter(c=>c.lg===lg&&c.k!=='KID'&&AVG[c.k]!=null);
 const taken=known.map(c=>Math.round(AVG[c.k])),free=[];
 for(let r=1;r<=n;r++){const i=taken.indexOf(r);if(i>=0)taken.splice(i,1);else free.push(r)}
 const teams=known.map(c=>({k:c.k,p:AVG[c.k]}));
 free.slice(0,Math.max(0,n-known.length)).forEach((r,i)=>teams.push({k:'x'+i,p:r}));
 for(const t of teams)t.v=t.p+gauss()*(1.3+t.p*.2)-(t.k===key?(adj||0):0);
 teams.sort((a,b)=>a.v-b.v);return teams.findIndex(t=>t.k===key)+1;
}

function postLabel(){const t=S.post&&S.post.t;return {coach:'指導者評価',sd:'経営手腕',biz:'事業規模',media:'解説者の評価',quiet:'穏やかさ'}[t]||'評価'}
/* ===== simulation ===== */
const ROLE={ace:['絶対的エース',.95],starter:['レギュラー',.82],rotation:['ローテーション要員',.5],bench:['控え',.25],out:['構想外',.05]};
const roleOf=d=>d>=10?'ace':d>=3?'starter':d>=-4?'rotation':d>=-11?'bench':'out';
const salaryAt=k=>{const c=C[k],o=ovr();let s=20000*infl(S.year)*Math.exp((c.lv-30)*.105)*LG[c.lg].pay*Math.pow(clamp(o/c.lv,.75,1.35),3);if(o>=88)s*=1.5;if(S.age<19)s*=.3;return Math.max(1000,Math.round(s/1000)*1000)};

const wasStage=['グループ敗退','ベスト16','ベスト8','ベスト4','準優勝','優勝'];
function euRun(ts){const r=clamp((ts-75)/20,0,1.2),p=clamp(.32+r*.36,.2,.82);if(!chance(clamp(p+.2,.4,.95)))return 0;let s=1;for(let i=0;i<4;i++){if(chance(p))s++;else return s}return 5}
function cupRun(ts,lg){const p=clamp(.5+(ts-LG[lg].m)*.012,.25,.85);let w=0;for(let i=0;i<5;i++){if(chance(p))w++;else break}return w} // 5 = champion
const cupName=['初戦敗退','2回戦敗退','ベスト16','ベスト8','準決勝敗退','優勝'];
function applyFocus(f){
 if(f==='rest')return chg({health:ri(4,8),joy:ri(3,6)});
 const room=S.bonus[f]>12?.2:S.bonus[f]>6?.55:1;
 const gain=Math.max(0,Math.round(ri(1,3)*Math.sqrt(S.t)*room*(S.age<=14?1.25:1)*(S.age>30?.5:1)));
 return chg({[f]:gain,health:-ri(0,1)});
}

 AUTO=was;

 else{miss=base*.5;if(chance(.45)){miss+=.25;h=chg({health:-9,phy:-ri(2,4)});say(`<p>復帰直後に同じ箇所を痛めてしまった。無理は代償を伴った。</p>${h}`,'bad');return miss}h=chg({health:-4,phy:sev===2?-ri(1,2):0})}
 say(`<p>${i===1?'手術は成功。リハビリは順調に進んだ。':i===2?'歯を食いしばって復帰した。幸い再発はなかった。':'クラブのスタッフと、長いリハビリの日々を過ごした。'}</p>${h}`,'res');

const rate={FW:{g:.45,a:.18},MF:{g:.1,a:.22},DF:{g:.035,a:.06},GK:{g:0,a:0}};
/* 5大リーグ1部の1人当たり得点数（年間総得点≒4,900 ÷ 登録選手≒2,700）をもとにGKの得点確率を算出 */
const TOP5={goals:4900,players:2700,apps:21};
const GK_FACTOR=1/150; // GKが得点機会を得る割合（セットプレー終盤の攻撃参加など）
const gkGoalP=lgk=>(TOP5.goals/TOP5.players/TOP5.apps)*GK_FACTOR*((lgk==='D'||lgk==='C')?1.5:1);

   say(`<h3>残留を懸けた最終節</h3><p>降格圏との差はわずか。勝たなければ、クラブは来季、一つ下のリーグで戦うことになる。サポーターのバナーには「最後まで一緒に」と書かれていた。</p>`,'big');
   const i=await ask('あなたはどうする？',[{label:'責任を背負い、全力で戦う',sub:'前線から走り続ける'},{label:'監督に戦術変更を直訴する',sub:'守備固めか、一点勝負か'},{label:'チームメイトを鼓舞する',sub:'円陣の中心に立つ'}]);
   const hit=chance(clamp(.5+(ctx.o-ctx.L)*.012+[.03,.0,.05][i],.3,.85));
   if(hit){ctx.rank=Math.min(ctx.rank,n-4);ctx.fame+=4;ctx.joy+=8;say(`<p>最終節、劇的な勝利で残留を決めた。ピッチ全体にサポーターがなだれ込み、街の夜は朝まで続いた。</p>`,'good')}
   else{ctx.rank=Math.max(ctx.rank,n-2);ctx.joy-=8;say(`<p>力及ばず、降格が決まった。ロッカールームに響いたのは、誰かのすすり泣きだけだった。</p>`,'bad')}
  }
  // 3) 昇格争い
  else if((lgk==='B'||lgk==='C')&&ctx.rank<=5&&ctx.rank>=3){
   say(`<h3>昇格プレーオフ</h3><p>自動昇格には届かなかったが、プレーオフで一発勝負のチャンスがある。勝てば、クラブは新たな舞台へ。</p>`,'big');

   if(hit){ctx.rank=2;ctx.fame+=4;ctx.joy+=8;honor('昇格プレーオフ勝利',2);say(`<p>歓喜の昇格。クラブの歴史に残る夜になった。</p>`,'good')}else{ctx.joy-=4;say(`<p>わずかに及ばず、昇格を逃した。来季への悔しさが、胸に残った。</p>`,'bad')}

  if(chance(.3)){

 }finally{AUTO=was}
}
function milestones(pa,pg,pc){
 for(const m of [100,250,500,750,1000])if(pa<m&&S.tot.apps>=m){chg({fame:2,joy:3});honor(`クラブ通算${m}試合`,0);say(`<h3>記念の${m}試合出場</h3><p>通算${m}試合出場。ロッカーには花束が届き、スタンドではあなたの名前が書かれたバナーが広がった。</p>`,'big')}
 for(const m of [50,100,200,300,400,500])if(pg<m&&S.tot.goals>=m&&S.pos!=='GK'){chg({fame:3,joy:4});honor(`クラブ通算${m}ゴール`,0);say(`<h3>通算${m}ゴール</h3><p>通算${m}ゴールの大台に到達。記念のゴールボールを手に、あなたはサポーターに深く一礼した。</p>`,'big')}
}
async function playSeason(miss){

 const ctx={rank:rank0,g:Math.max(0,g),as:Math.max(0,as),cs,ap:ap0,lgk,lg,o,L,youth,fame:0,joy:0,ts:L+(11-rank0)*.7+Math.max(0,o-L)*.1};
 if(!youth&&ap0>=8)await seasonMoments(ctx);
 const ap=ctx.ap;g=ctx.g;as=ctx.as;cs=Math.min(cs,ap);
 let rank=ctx.rank;const ts=ctx.ts;
 let rating=6.15+(o-refL)/20+gauss()*.22+(S.flags.adapt?-.35:0);
 rating+=S.pos==='GK'?Math.min(.4,cs/Math.max(1,ap)):Math.min(.5,g/Math.max(1,ap)*.7);
 rating=clamp(Math.round(rating*10)/10,5.5,8.7);
 const pa=S.tot.apps,pg=S.tot.goals;
 S.rows.push({a:S.age,y:S.year,c:cname(S.club)+(youth?'U':''),k:S.club,u:youth,ap,g,as,cs,r:ap?rating.toFixed(1):'-',lg:lgk});
 if(!youth){S.tot.apps+=ap;S.tot.goals+=g;S.tot.assists+=as;S.tot.cs=(S.tot.cs||0)+cs}
 if(!youth&&S.tot.apps===ap&&ap>0&&!S.flags.debut){S.flags.debut=1;
  say(`<h3>プロデビュー</h3><p>${cname(S.club)}のユニフォームを着て、初めて公式戦のピッチに立った。${pick(['スタンドから聞こえたのは、見知らぬ数千人が自分の名前を呼ぶ声だった。','ロッカーで祈っていた祖母の顔が浮かんだ。','最初のボールタッチは、ひどく震えていた。それでも、確かに足がボールを覚えていた。'])}</p>`,'big');honor('プロデビュー',0)}
 const rl=ROLE[S.role][0];

  S.role==='ace'?`${rl}としてチームを引っ張り、${ap}試合に出場。`:

 }else{ if(rank===1){honor('ユースリーグ優勝',1);out.push('ユースリーグ優勝')} if(o-refL>=8&&chance(.4)){honor('ユース年間最優秀選手',1);out.push('ユース年間最優秀選手')}}
 {const row=S.rows[S.rows.length-1];const extra=ctx.g-row.g;if(extra>0){row.g=ctx.g;if(!youth)S.tot.goals+=extra}g=ctx.g}

 const exp=30000*I+Math.max(0,S.money)*.015+S.kids.length*15000*I;
 const mh=chg({money:Math.round(inc-exp)});
 const gl=S.pos==='GK'?'無失点':'得点';
 const cells=S.pos==='GK'?`<div><b>${cs}</b><span>無失点</span></div><div><b>${g}</b><span>得点</span></div>`:`<div><b>${g}</b><span>得点</span></div><div><b>${as}</b><span>アシスト</span></div>`;
 say(`<h3>${S.year}-${String(S.year+1).slice(2)}シーズン　${esc(cname(S.club))}${youth?' ユース':''}</h3><p>${txt}${out.length?'<br><b>'+out.join(' ／ ')+'</b>':''}</p>
 <div class="season"><div><b>${ap}</b><span>出場</span></div>${cells}<div><b>${ap?rating.toFixed(1):'-'}</b><span>評価</span></div><div><b>${rank}位</b><span>${youth?'ユース順位':'リーグ順位'}</span></div></div><p style="margin-top:8px">${fh}${mh}</p>`,out.some(x=>/優勝|昇格/.test(x))||rank===1?'big':rank>=n-2?'bad':'');
 if(!youth)milestones(pa,pg);

const IMP=new Set(['agent','marriage','bet','fix','heart','doping','coachclash','license','hotel','maturita']);
async function runEvents(mode,count){
 // mode: 'all' = every event asks the player, 'imp' = only life/career-defining ones ask, 'auto' = none ask
 const n=count!=null?count:(pro()||youth())?(chance(.55)?(chance(.15)?2:1):0):ret()?(chance(.5)?1:0):1;
 for(let j=0;j<n;j++){
  const cand=EVENTS.filter(e=>(e.rep||!done(e.id))&&e.ok());
  if(!cand.length)break;
  const SC=new Set(['bet','club','doping','fix','taxes']),rm=clamp(S.risk/40,.25,2.5);
  const W=e=>e.w*(mode==='imp'&&IMP.has(e.id)?2:1)*(SC.has(e.id)?rm:1);
  let t=cand.reduce((a,e)=>a+W(e),0)*Math.random(),ev=cand[0];
  for(const e of cand){t-=W(e);if(t<=0){ev=e;break}}
  if(!ev.rep)S.flags['d_'+ev.id]=1;
  AUTO=!(mode==='all'||(mode==='imp'&&IMP.has(ev.id)));
  try{await ev.run()}finally{AUTO=false}
  if(S.flags.forceRetire)break;
 }
}

async function lifeLoop(){
 const my=RUN,mine=S;
 while(!S.dead){
  if(my!==RUN||mine!==S)return;
  save();yrHead();
  if(S.age===0){await birth();await infancy()}
  else if(S.age<15)await childStep();
  else await yearFlow();
  if(my!==RUN||mine!==S)return;
  const step=ageStep();
  for(let i=0;i<step;i++){
   S.age++;S.year++;
   if(deathCheck()){S.dead=true;break}
   if(S.lv==='retired'&&i<step-1)aging();
  }
  renderCard();
 }
 await ending();
}

function lifeScore(){

 return Math.round(S.peak*1.5+pts*4+S.caps*.4+Math.min(S.tot.goals,600)*.15+S.fame+Math.log10(Math.max(10,S.money))*8+S.joy*.5+(S.spouse||S.flags.divorced?10:0)+S.kids.length*5+Math.max(0,S.age-60)*.5);
}

function aggregate(){
 const rows=S.rows.filter(r=>!r.u),by={},lgs={};
 for(const r of rows){const k=r.k||r.c;const b=by[k]=by[k]||{name:r.c,lg:r.lg,ap:0,g:0,as:0,cs:0,a0:r.a,a1:r.a};b.ap+=r.ap;b.g+=r.g;b.as+=r.as;b.cs+=r.cs||0;b.a1=r.a;
  const l=lgs[r.lg]=lgs[r.lg]||{ap:0,g:0,as:0,cs:0};l.ap+=r.ap;l.g+=r.g;l.as+=r.as;l.cs+=r.cs||0}
 return{by:Object.values(by),lgs:Object.entries(lgs)};
}

 const sv=loadSave();
 const wrap=document.createElement('div');wrap.className='title-screen';
 wrap.innerHTML=`<div class="psub" style="letter-spacing:.14em">ITALIA ・ CALCIO ・ VITA</div><h2>イタリアに生まれ、<br>ボールとともに生きて、死ぬ。</h2><p>0歳から最期の日まで。名前も、生まれた町も、才能も、選べるのはほんの一部だけ。<br>ポジション、移籍、恋、スキャンダル、そして引退後の人生まで。サッカー選手の一生を、追体験しよう。</p><label for="nm">あなたの名前（空欄ならイタリア風の名前がランダムで付きます）</label><input id="nm" maxlength="24" autocomplete="off" placeholder="例：Luca Ferrari"><label for="rg">生まれる場所</label><select id="rg"><option value="-1">おまかせ（ランダム）</option>${REGIONS.map((r,i)=>`<option value="${i}">${r.n}州</option>`).join('')}</select><label for="era">生まれる年（1970年から5年刻み。選んだ年から人生が始まります）</label><select id="era"><option value="-1">おまかせ（ランダム）</option>${BYEARS.map(y=>`<option value="${y}">${y}年${y===2026?'（現在）':''}</option>`).join('')}</select>`;
 feed.appendChild(wrap);
 const opts=[{label:'新しい人生を始める',sub:'出身と年代は上で選べます。家庭と才能はランダム'}];
 if(sv&&!sv.dead&&sv.age>=3)opts.push({label:`続きから（${sv.name}・${sv.age}歳）`,sub:'前回の自動保存から再開'});
 const i=await ask(null,opts);
 const nm=($('#nm')?$('#nm').value.trim():'').slice(0,24);
 const rgv=$('#rg')?$('#rg').value:'-1',erv=$('#era')?$('#era').value:'-1';
 feed.innerHTML='';
 if(i===1){S=sv;ensureKid();renderLog();renderCard();lifeLoop()}
 else{S=newState(nm,+rgv,+erv);renderCard();lifeLoop()}
}
$('#btn-pause').onclick=()=>setPaused(!PAUSED);
$('#btn-speed').onclick=function(){SPEED=(SPEED+1)%3;this.textContent='速度：'+['ゆっくり','ふつう','はやい'][SPEED]};
let rsTimer=0;
$('#btn-restart').onclick=function(){
 if(!rsTimer){this.textContent='もう一度押すとリセット';rsTimer=setTimeout(()=>{rsTimer=0;this.textContent='最初からやり直す'},3000);return}
 clearTimeout(rsTimer);rsTimer=0;this.textContent='最初からやり直す';clearSave();title();
};
title();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body></html>
